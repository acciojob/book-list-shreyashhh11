<!DOCTYPE html>
<html>
<head>
    <title>MyBookList</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>MyBookList</h1>
        
        <div class="form-group">
            <label for="title">Title</label>
            <input type="text" id="title" placeholder="Enter Book Title">
            
            <label for="author">Author</label>
            <input type="text" id="author" placeholder="Enter Author Name">
            
            <label for="isbn">ISBN#</label>
            <input type="text" id="isbn" placeholder="Enter ISBN">
            
            <button id="submit">Add Book</button>
        </div>

        <table class="table table-striped">
            <thead>
                <tr>
                    <th>Title</th>
                    <th>Author</th>
                    <th>ISBN#</th>
                    <th></th> <!-- Column for the clear button -->
                </tr>
            </thead>
            <tbody id="book-list">
                <!-- Book rows will be dynamically added here -->
            </tbody>
        </table>
    </div>

    <script type="text/javascript" src="./script.js"></script>
</body>
</html>
